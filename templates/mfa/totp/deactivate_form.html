{% extends 'base.html' %}
{% load i18n %}

{% block title %}Desactivar verificación en dos pasos - SG Church{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow"><div class="card-body p-4">
                <h1 class="h5 mb-3">Desactivar la verificación en dos pasos</h1>
                <p class="text-muted">Tu cuenta volverá a protegerse solo con la contraseña. ¿Seguro?</p>
                <form method="post" action="{% url 'mfa_deactivate_totp' %}">
                    {% csrf_token %}
                    <a href="{% url 'mfa_index' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Desactivar</button>
                </form>
            </div></div>
        </div>
    </div>
</div>
{% endblock %}
