{% comment %}
Uso: {% include "partials/kpi_card.html" with label="Total Miembros" value=total_members icon="bi-people" color="primary" %}
Opcionales: prefix="$" (antes del valor), value_color="success" (color del número).
{% endcomment %}
<div class="card kpi-card dashboard-card h-100">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center gap-3">
            <div>
                <p class="text-muted mb-1">{{ label }}</p>
                <div class="kpi-value{% if value_color %} text-{{ value_color }}{% endif %}">{{ prefix }}{{ value }}</div>
            </div>
            <div class="kpi-icon bg-{{ color|default:'primary' }} bg-opacity-10 text-{{ color|default:'primary' }}" aria-hidden="true">
                <i class="bi {{ icon }}"></i>
            </div>
        </div>
    </div>
</div>
