# SG Church - Django Project Configuration

[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    */migrations/*,
    venv,
    .venv,
    env
ignore = E501, W503

[isort]
profile = django
line_length = 120
skip_glob = */migrations/*

# black is configured via pyproject.toml, not setup.cfg (it doesn't read
# this file). A [black] section with TOML syntax used to live here — it did
# nothing for black but broke every other tool that parses setup.cfg as INI
# (pytest, coverage.py, flake8), since '/(' isn't valid INI syntax.

# pytest config lives in pytest.ini (DJANGO_SETTINGS_MODULE =
# sg_church.settings.test) — duplicating a [tool:pytest] section here risked
# the two drifting out of sync.
