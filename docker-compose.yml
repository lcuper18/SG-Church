# Hosted, multi-church SaaS deployment: Postgres + Redis + gunicorn + a
# Celery worker and scheduler. Every service has a memory/CPU ceiling so a runaway
# process cannot starve the other applications on a shared server.
#
# Usage:
#   docker compose up -d
#
# All secrets/config come from a .env file next to this one (copy
# .env.example, fill it in, never commit it). DATABASE_PASSWORD is required
# — there is no default, on purpose.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-sgchurch}
      POSTGRES_USER: ${DATABASE_USER:-sgchurch}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-sgchurch}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  web:
    build: .
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=sg_church.settings.production
      - DATABASE_HOST=db
      - DATABASE_NAME=${DATABASE_NAME:-sgchurch}
      - DATABASE_USER=${DATABASE_USER:-sgchurch}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - media_data:/app/media
      - backup_data:/app/backups
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: "1.5"

  celery:
    build: .
    # Two task processes are plenty (e-mails, reminders, backups); each one restarts after
    # 200 tasks. Raise CELERY_CONCURRENCY if the e-mail queue ever backs up.
    command: celery -A sg_church worker -l info --concurrency=${CELERY_CONCURRENCY:-2} --max-tasks-per-child=200
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=sg_church.settings.production
      - DATABASE_HOST=db
      - DATABASE_NAME=${DATABASE_NAME:-sgchurch}
      - DATABASE_USER=${DATABASE_USER:-sgchurch}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - media_data:/app/media
      - backup_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # Runs the schedule (nightly backup). One instance only; the worker does the work.
  beat:
    build: .
    command: celery -A sg_church beat -l info -s /tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=sg_church.settings.production
      - DATABASE_HOST=db
      - DATABASE_NAME=${DATABASE_NAME:-sgchurch}
      - DATABASE_USER=${DATABASE_USER:-sgchurch}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"

volumes:
  postgres_data:
  media_data:
  backup_data:
